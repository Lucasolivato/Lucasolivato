<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Lucas Olivato — QA Automation Engineer</title>
  <desc id="d">Transformo requisitos em software confiável. Resultados reais: 1.643 testes aprovados, 229 de 229 testes unitários com 90% de cobertura, 600 pedidos automatizados em 10 horas.</desc>
  <defs>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="#0C0E0F"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="17.5" fill="none" stroke="#262D30"/>

  <!-- marca -->
  <rect x="56" y="50" width="12" height="12" rx="2" fill="#34D399"/>
  <text x="80" y="61" class="mono" font-size="17" fill="#E8ECEA">lucas.olivato</text>

  <!-- selo -->
  <rect x="56" y="88" width="244" height="30" rx="15" fill="#0F1A16" stroke="#1E4D3B"/>
  <circle cx="75" cy="103" r="4.5" fill="#34D399"/>
  <text x="88" y="108" class="sans" font-size="14" font-weight="600" fill="#E8ECEA">Aberto a novas oportunidades</text>

  <!-- título -->
  <text x="54" y="182" class="sans" font-size="50" font-weight="700" letter-spacing="-1.5" fill="#E8ECEA">Transformo requisitos em</text>
  <text x="54" y="240" class="sans" font-size="50" font-weight="700" letter-spacing="-1.5" fill="#34D399">software confiável.</text>

  <text x="56" y="298" class="mono" font-size="16" fill="#9AA3A0">QA Automation Engineer · desenvolvimento · agentes de IA</text>

  <!-- quality-report.txt -->
  <g transform="translate(772 56)">
    <rect width="372" height="248" rx="14" fill="#121617" stroke="#262D30"/>
    <line x1="0" y1="46" x2="372" y2="46" stroke="#262D30"/>
    <text x="20" y="29" class="mono" font-size="13" fill="#9AA3A0">quality-report.txt</text>
    <text x="352" y="29" class="mono" font-size="12" fill="#34D399" text-anchor="end">resultados reais</text>

    <text x="20" y="80" class="mono" font-size="13" fill="#9AA3A0">analytics com IA · vitest</text>
    <text x="20" y="101" class="mono" font-size="15" fill="#34D399">✓ 1.643 passed <tspan fill="#E8ECEA">· 0 failed</tspan></text>

    <text x="20" y="138" class="mono" font-size="13" fill="#9AA3A0">agente de IA · pytest</text>
    <text x="20" y="159" class="mono" font-size="15" fill="#34D399">✓ 229/229 passed <tspan fill="#E8ECEA">· 90% cobertura</tspan></text>

    <text x="20" y="196" class="mono" font-size="13" fill="#9AA3A0">SAP · robot framework</text>
    <text x="20" y="217" class="mono" font-size="15" fill="#F5B84B">600+ pedidos <tspan fill="#E8ECEA">· em 10 h</tspan></text>
  </g>
</svg>
